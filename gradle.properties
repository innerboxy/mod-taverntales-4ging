# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 26.1 起 Mojang 的映射已去混淆并自带参数名,不再需要 Parchment。
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.109
loader_version_range=[1,)
jei_version=29.37.0.100
beyonddimensions_version=0.7.30-26.1.2-neoforge
# JustEnoughResources:这里填的是 Modrinth 的【版本 ID】而非版本号(1.10.1.40)。
# 因为 JER 的同一个版本号在 forge/fabric/neoforge 下各发了一份,用版本号会解析到 Forge 版,
# NeoForge 会因其老式 META-INF/mods.toml 拒绝加载。版本 ID 才能精确锁定 NeoForge 那份。
# 对应 JustEnoughResources-NeoForge-26.1.2-1.10.1.40.jar
jer_version=tBAdXL1H

