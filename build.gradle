// 装备锻造台（原 taverntales-4ging）
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/mod-common.gradle')

neoForge {
    accessTransformers {
        from 'src/main/resources/META-INF/accesstransformer.cfg'
    }
}

dependencies {
    // pinyin4j：锻造台界面的拼音搜索，打包进 jar
    implementation "com.belerweb:pinyin4j:${pinyin4j_version}"
    jarJar "com.belerweb:pinyin4j:${pinyin4j_version}"

    // JEI (optional)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // BeyondDimensions (optional)
    compileOnly "maven.modrinth:beyonddimensions:${beyonddimensions_version}"

    // Just Enough Resources (optional)
    compileOnly "maven.modrinth:just-enough-resources-jer:${jer_version}"
    runtimeOnly "maven.modrinth:just-enough-resources-jer:${jer_version}"
}
